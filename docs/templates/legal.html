<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{legal_title}} | MuscleLib</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/page/css/docs.css">
</head>
<body class="light-theme">
  <nav class="navbar navbar-fixed navbar-expand-lg navbar-light bg-light docs-topbar">
    <div class="container-fluid navbar-docs">
      <div class="navbar-left">
        <a class="navbar-brand docs-brand" href="/{{lang}}/" aria-label="MuscleLib">
          <img
            src="https://n519x3fvhoado5zf.public.blob.vercel-storage.com/avatars/69651f2b148c75323c2a9c7e/1769382801270.svg"
            data-logo-dark="https://n519x3fvhoado5zf.public.blob.vercel-storage.com/avatars/69651f2b148c75323c2a9c7e/1769382801270.svg"
            data-logo-light="https://n519x3fvhoado5zf.public.blob.vercel-storage.com/avatars/69651f2b148c75323c2a9c7e/1769911366095.svg"
            alt="MuscleLib logo"
            class="brand-logo"
          >
        </a>
      </div>
      <div class="navbar-actions">
        <div class="dropdown language-dropdown">
          <button class="btn docs-icon-btn language-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="{{t:menu.lang}}" title="{{t:menu.lang}}">
            <span class="language-globe" aria-hidden="true"><span class="fi" data-current-country-flag></span></span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end docs-dropdown language-menu">
            <li><a class="dropdown-item" href="/pt/{{legal_path}}" hreflang="pt" lang="pt" data-lang="pt" aria-label="Português"><span class="fi fi-br language-flag" aria-hidden="true"></span><span>Português</span><i class="bi bi-check2 language-check" aria-hidden="true"></i></a></li>
            <li><a class="dropdown-item" href="/es/{{legal_path}}" hreflang="es" lang="es" data-lang="es" aria-label="Español"><span class="fi fi-es language-flag" aria-hidden="true"></span><span>Español</span><i class="bi bi-check2 language-check" aria-hidden="true"></i></a></li>
            <li><a class="dropdown-item" href="/en/{{legal_path}}" hreflang="en" lang="en" data-lang="en" aria-label="English"><span class="fi fi-us language-flag" aria-hidden="true"></span><span>English</span><i class="bi bi-check2 language-check" aria-hidden="true"></i></a></li>
          </ul>
        </div>
        <div class="dropdown">
          <button class="btn docs-action-btn dropdown-toggle" type="button" id="themeToggle" data-bs-toggle="dropdown" aria-expanded="false" aria-label="{{t:menu.theme}}" title="{{t:menu.theme}}">
            <i data-theme-icon class="bi bi-sun"></i>
            <span data-theme-text data-light="{{t:theme.light}}" data-dark="{{t:theme.dark}}" data-auto="{{t:theme.auto}}" class="d-none d-sm-inline">{{t:theme.light}}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end theme-select-box theme-menu docs-dropdown" aria-labelledby="themeToggle">
            <li><button class="dropdown-item theme-select-text" data-theme="light" aria-pressed="false"><i class="bi bi-sun"></i><span>{{t:theme.light}}</span><i class="bi bi-check2 theme-check" aria-hidden="true"></i></button></li>
            <li><button class="dropdown-item theme-select-text" data-theme="dark" aria-pressed="false"><i class="bi bi-moon-stars"></i><span>{{t:theme.dark}}</span><i class="bi bi-check2 theme-check" aria-hidden="true"></i></button></li>
            <li><button class="dropdown-item theme-select-text" data-theme="auto" aria-pressed="false"><i class="bi bi-circle-half"></i><span>{{t:theme.auto}}</span><i class="bi bi-check2 theme-check" aria-hidden="true"></i></button></li>
          </ul>
        </div>
        <a class="btn docs-action-btn docs-icon-btn" href="{{github_url}}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <i class="bi bi-github"></i>
        </a>
      </div>
    </div>
  </nav>

  <main class="legal-main">
    <a class="legal-back-link" href="/{{lang}}/docs">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
      {{t:api.documentation}}
    </a>
    <article class="legal-content">
      {{{legal_content}}}
    </article>
  </main>

  <footer class="copyright text-center py-4">
    <p>&copy; <span id="current-year"></span> <span>{{t:copyright}}</span></p>
    <nav class="legal-related-links" aria-label="Legal">
      <a href="/{{lang}}/terms">{{t:terms.of.service}}</a>
      <a href="/{{lang}}/privacy">{{t:privacy.policy}}</a>
    </nav>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/page/js/script.js"></script>
  <script src="/page/js/dark-light.js"></script>
</body>
</html>
